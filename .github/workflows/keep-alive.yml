name: Keep Render Server Awake

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions cron is often delayed, 5 mins gives a better buffer)
    - cron: '*/5 * * * *'
  # Allows you to run this workflow manually from the Actions tab if needed
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        # We ping the /health endpoint with a User-Agent to ensure a 200 OK response
        run: curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" https://chatapp-lewz.onrender.com/health > /dev/null
